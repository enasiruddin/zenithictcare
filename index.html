        const imgF = (k, v) => `<div class=dz tabindex=0 onfocus="pk='${k}'" onclick="pk='${k}'" ondragover="event.preventDefault();this.classList.add('ov')" ondragleave="this.classList.remove('ov')" ondrop="event.preventDefault();this.classList.remove('ov');imgFile(event.dataTransfer.files[0],'${k}')">ছবি এখানে ড্রপ করো, অথবা এখানে ক্লিক করে Ctrl+V দিয়ে পেস্ট করো</div><div class=fl style="margin-top:4px"><input type=file accept="image/*" onchange="upl(this,'${k}')">${v ? `<img src="${v}" style="height:44px"><button class=sm onclick="setp(ed,'${k}','');draw()">ছবি সরাও</button>` : ""}</div>`;

        // একটি প্রশ্নের ফর্ম (লেখা, ছবি, বিবৃতি, অপশন ও সঠিক উত্তর)
        const sf = (o, p) => `<label>প্রশ্ন</label><textarea data-k="${p}text" rows=2>${esc(o.text)}</textarea>${imgF(p + "img", o.img)}` + (o.type == "multi" ? [0, 1, 2].map((i) => `<label>${["i", "ii", "iii"][i]}.</label><input data-k="${p}st.${i}" value="${esc(o.st[i])}">`).join("") : "") + `<label>অপশন (সঠিকটি বেছে নাও)</label>` + [0, 1, 2, 3].map((i) => `<div class=r><input type=radio name="${p}a" data-k="${p}ans" value=${i} ${o.ans == i ? "checked" : ""}><b>${LB[i]}</b><input data-k="${p}opts.${i}" value="${esc(o.opts[i])}"></div>`).join("") + (o.type == "multi" ? `<button class=sm onclick="dflt('${p}')">ডিফল্ট অপশনে ফিরো</button>` : "");

        // প্রশ্ন এডিটরের পাতা
        function vE() {
          // q = এডিট হওয়া প্রশ্ন
          const q = ed;
          // g = প্রশ্নটি উদ্দীপক কিনা
          const g = q.type == "group";
          // এডিটরের শিরোনাম, অধ্যায়/টাইপ/উৎস/নোট, গণিত মোড, LaTeX পরিষ্কার বাটন, চিহ্নের প্যালেট,
          // উদ্দীপকের ঘর ও উপপ্রশ্ন (বা সাধারণ ফর্ম) এবং সেভ/বাতিল বাটন — সবই নিচের HTML-এ
          return `<h3>${S.q.some((x) => x.id == q.id) ? "প্রশ্ন এডিট" : "নতুন প্রশ্ন"}</h3><div class=ed2><div><div class=card><div class=two><div><label>অধ্যায় (বাধ্যতামূলক)</label><select data-k=ch>${chOpts(q.ch)}</select></div><div><label>টাইপ</label><select data-k=type>${opt([["single", "Single"], ["multi", "Multiple (i, ii, iii)"], ["group", "উদ্দীপক"]], q.type)}</select></div><div style="grid-column:1/-1">${srcF(q)}</div><div><label>নোট / কিওয়ার্ড (সার্চের জন্য)</label><input data-k=note value="${esc(q.note)}"></div></div>
<label><input type=checkbox data-k=mx ${q.mx ? "checked" : ""}> গণিত মোড: $...$ লেখা গণিতের আকারে দেখাবে (বন্ধ থাকলে পেস্ট করা LaTeX নিজে সাধারণ লেখা হবে)</label><button class=sm onclick="cleanAll()">🧹 এই প্রশ্নের LaTeX সাধারণ লেখায় বদলাও</button><div class=pal><button class=sm title="~A লিখলে A-এর ওপরে দাগ পড়ে" onmousedown="event.preventDefault();ins('~')">~ ওভারলাইন (১টি অক্ষর)</button><button class=sm title="~{A+B} লিখলে পুরো অংশের ওপরে দাগ পড়ে" onmousedown="event.preventDefault();ins('~{}')">~{ } ওভারলাইন (অংশ)</button>${["₀", "₁", "₂", "₃", "₄", "₅", "₆", "₇", "₈", "₉", "²", "≤", "≥", "≠", "×", "÷", "⊕", "̅"].map((c) => `<button class=sm onmousedown="event.preventDefault();ins('${c}')">${c == "̅" ? "ওভারলাইন (অক্ষরের পরে)" : c}</button>`).join("")}</div>
${g ? `<label>ঘোষণা লাইন</label><select data-k=stem.pre>${opt(PRE.map((x) => [x, x]), q.stem.pre)}</select><label><input type=checkbox data-k=stem.ut ${q.stem.ut !== false ? "checked" : ""}> উদ্দীপক (লেখা) – প্রশ্নে যোগ হবে</label><textarea data-k=stem.text rows=3>${esc(q.stem.text)}</textarea><label><input type=checkbox data-k=stem.uc ${q.stem.uc !== false ? "checked" : ""}> উদ্দীপক (কোড) – প্রশ্নে যোগ হবে</label><textarea data-k=stem.code rows=3 style="font-family:monospace">${esc(q.stem.code)}</textarea><label><input type=checkbox data-k=stem.ui ${q.stem.ui !== false ? "checked" : ""}> উদ্দীপক (ছবি) – প্রশ্নে যোগ হবে</label>${imgF("stem.img", q.stem.img)}` + q.kids.map((o, i) => `<div class=card><div class=fl><b>প্রশ্ন ${bn(i + 1)}</b><select data-k="kids.${i}.type">${opt([["single", "Single"], ["multi", "Multiple"]], o.type)}</select>${q.kids.length > 1 ? `<button class=sm onclick="ed.kids.splice(${i},1);draw()">সরাও</button>` : ""}</div>${sf(o, "kids." + i + ".")}</div>`).join("") + (q.kids.length < 2 ? `<button onclick="ed.kids.push(ns());draw()">+ দ্বিতীয় প্রশ্ন</button>` : "") : sf(q, "")}
<div class=fl style="margin-top:12px"><button class=pr onclick="saveQ()">সেভ করো</button><button onclick="ed=null;draw()">বাতিল</button></div></div></div><div id=sim class=card></div></div>`;
        }

        // সেটে নির্বাচিত প্রশ্নের তালিকা (↑ ↓ ✕ বাটনসহ)
        const selH = () => `<b>মোট ${bn(cnt())} টি প্রশ্ন নির্বাচিত</b>` + cur.ids.map((id, i) => {
          const q = S.q.find((x) => x.id == id);
          return q ? `<div class=row style="margin:4px 0"><span><small>${bn(i + 1)}.</small> ${smh(q)}</span><span style="white-space:nowrap"><button class=sm onclick="mv(${i},-1)">↑</button><button class=sm onclick="mv(${i},1)">↓</button><button class=sm onclick="tog('${id}',false)">✕</button></span></div>` : "";
        }).join("");

        // সেট তৈরির পাতা
        function vS() {
          // প্রশ্ন সংখ্যা অনুযায়ী সময় ও পূর্ণমান (অটো চালু থাকলে) নবায়ন করে
          syncAuto();
          // একটি লেখার ইনপুট ঘর বানানোর ছোট ফাংশন
          const f = (k, l) => `<div><label>${l}</label><input value="${esc(cur[k])}" oninput="cur.${k}=this.value"></div>`;
          // সময় ও পূর্ণমানের ঘর: অটো মান দেখায়, হাতে লিখলে অটো বন্ধ হয়, "অটো" বাটনে আবার চালু হয়
          const fa = (k, l, flag) => `<div><label>${l} <small id=st_${k} class=mu>${cur[flag] ? "(অটো)" : "(নিজে বদলানো)"}</small></label><div class=fl><input class=s id=f_${k} value="${esc(cur[k])}" oninput="cur.${k}=this.value;cur.${flag}=false;syncAuto()"><button class=sm onclick="autoOn('${flag}')">অটো</button></div></div>`;
          // সেটের তথ্যের ফর্ম ও সেভ/প্রিভিউ বাটন, তার পর ব্যাংক থেকে বাছাই ও নির্বাচিত তালিকা (দুই কলাম)
          return `<div class=card><div class=two>${f("org", "প্রতিষ্ঠানের নাম (শিরোনাম)")}${f("code", "সেট কোড")}${f("name", "সেটের নাম")}${f("exam", "পরীক্ষার নাম")}${f("date", "তারিখ")}${fa("time", "সময়", "autoT")}${fa("marks", "পূর্ণমান", "autoM")}${f("scode", "বিষয় কোড")}${f("sub", "শিরোনামের নিচের লাইন")}<div style="grid-column:1/-1"><label>বিশেষ দ্রষ্টব্য</label><textarea rows=3 oninput="cur.note=this.value">${esc(O("note"))}</textarea></div></div><div class=fl style="margin-top:10px"><button class=pr onclick="saveSet()">সেভ করো</button><button onclick="prev()">প্রিভিউ / প্রিন্ট</button></div></div>
<div class=two><div><h3>ব্যাংক থেকে বাছো</h3>${fbar()}<div class=fl style="margin:6px 0"><select id=rc>${chOpts("")}</select><input id=rn type=number min=1 value=3 style="width:70px"><button class=sm onclick="rnd()">র‍্যান্ডম যোগ</button></div><div id=lst style="max-height:60vh;overflow:auto">${lst()}</div></div><div><h3>নির্বাচিত</h3><div id=sel>${selH()}</div></div></div>`;
        }

        // প্রিভিউ / প্রিন্ট পাতা
        function vP() {
          // ২৫টি প্রশ্ন আছে এবং ওভারফ্লো নেই কিনা (এই মান এখন কোথাও ব্যবহার হয় না)
          const ok = cnt() == 25 && last && !last.over;
          // প্রিভিউর নিয়ন্ত্রণ বাটন (ধরন, কলাম, শাফল, ফন্ট, প্রিন্ট) ও পাতার জায়গা
          return `<div class="no-print card"><div class=fl><button onclick="view='set';draw()">← ফিরে যাও</button>${[["q", "শুধু প্রশ্ন"], ["a", "প্রশ্ন ও উত্তরসহ"], ["b", "দুটোই"]].map((x) => `<button class="${ver == x[0] ? "on" : ""}" onclick="ver='${x[0]}';rp()">${x[1]}</button>`).join("")}<label style="margin:0"><input type=checkbox ${cur.bt ? "checked" : ""} onchange="cur.bt=this.checked;prev()"> বোর্ড ট্যাগ প্রিন্টে</label><button class="${(cur.cc || 3) == 2 ? "on" : ""}" onclick="cur.cc=2;prev()">২ কলাম</button><button class="${(cur.cc || 3) == 3 ? "on" : ""}" onclick="cur.cc=3;prev()">৩ কলাম</button><button onclick="shuf()">🔀 শাফল</button><button onclick="fz(-.5)">A− ফন্ট কমাও</button><button onclick="fz(.5)">A+ ফন্ট বাড়াও</button><button onclick="cur.fs=null;prev()">অটো</button><button class=pr id=pb onclick="window.print()">Print / PDF</button><span id=inf class=mu></span></div><small class=mu>↕ প্রশ্ন টেনে অন্য প্রশ্নের ওপর ছেড়ে দিলে ক্রম বদলাবে। প্রিন্ট বন্ধ থাকলে পাতাটি আলাদা ট্যাবে খুলে চেষ্টা করো।</small></div><div id=print></div>`;
        }

        // বর্তমান ভিউ অনুযায়ী পুরো পাতা আঁকে
        function draw() {
          // প্রিভিউ ভিউ কিনা এবং প্রিন্টে বোর্ড ট্যাগ লাগবে কিনা ঠিক করে
          LM = view == "prev";
          PT = LM && !!cur.bt;
          // নেভিগেশনসহ নির্বাচিত ভিউয়ের HTML বসায়
          $("#app").innerHTML = nav() + "<div class=wrap>" + { dash: vD, ch: vC, src: vR, sets: vL, bank: vB, set: vS, prev: vP }[view]() + "</div>";
          // প্রশ্ন এডিট চললে ডুপ্লিকেট-চেক প্যানেল আঁকে
          if (view == "bank" && ed) sim();
        }

        // ---------- অ্যাকশন (বাটনের কাজ) ----------
        // নতুন অধ্যায় যোগ করে
        async function addCh() {
          const n = +$("#cn").value;
          const m = $("#cm").value.trim();
          if (!m) return alert("নাম লেখো");
          const id = uid();
          const r = await sb.from("chapters").insert({ id, num: n, name: m });
          if (r.error) return alert(r.error.message);
          S.ch.push({ id, n, name: m });
          draw();
        }

        // অধ্যায়ের নাম ও নম্বর এডিট করে
        async function editCh(id) {
          const c = S.ch.find((x) => x.id == id);
          const m = prompt("অধ্যায়ের নাম", c.name);
          if (m === null) return;
          const n = prompt("অধ্যায় নম্বর", c.n);
          const nn = +n || c.n;
          const r = await sb.from("chapters").update({ name: m, num: nn }).eq("id", id);
          if (r.error) return alert(r.error.message);
          c.name = m;
          c.n = nn;
          draw();
        }

        // অধ্যায় (ও তার সব প্রশ্ন) ডিলিট করে
        async function delCh(id) {
          if (!confirm("এই অধ্যায়ের সব প্রশ্নও মুছে যাবে। ডিলিট করবে?")) return;
          const r = await sb.from("chapters").delete().eq("id", id);
          if (r.error) return alert(r.error.message);
          await load();
          draw();
        }

        // নতুন প্রশ্নের এডিটর খোলে (অধ্যায় না থাকলে আগে অধ্যায় বানাতে বলে)
        function newQuestion() {
          if (!S.ch.length) {
            alert("প্রথমে একটি অধ্যায় তৈরি করো");
            return go("ch");
          }
          ed = newQ();
          view = "bank";
          draw();
        }

        // বিদ্যমান প্রশ্নের কপি এডিটরে খোলে
        function editQ(id) {
          ed = JSON.parse(JSON.stringify(S.q.find((q) => q.id == id)));
          draw();
        }

        // প্রশ্ন ডিলিট করে
        async function delQ(id) {
          if (!confirm("প্রশ্নটি ডিলিট করবে?")) return;
          const r = await sb.from("questions").delete().eq("id", id);
          if (r.error) return alert(r.error.message);
          S.q = S.q.filter((q) => q.id != id);
          S.sets.forEach((s) => s.ids = s.ids.filter((i) => i != id));
          draw();
        }

        // প্রশ্ন যাচাই করে ডেটাবেসে সেভ করে
        async function saveQ() {
          const q = ed;
          const subs = q.type == "group" ? q.kids : [q];
          // অধ্যায় বাছাই হয়েছে কিনা দেখে
          if (!q.ch) return alert("অধ্যায় বাছো");
          // উদ্দীপকের অন্তত একটি অংশ আছে কিনা দেখে
          if (q.type == "group" && !(q.stem.ut !== false && q.stem.text.trim() || q.stem.uc !== false && q.stem.code.trim() || q.stem.ui !== false && q.stem.img)) return alert("উদ্দীপকের অন্তত একটি অংশ লেখো ও টিক দাও");
          // প্রতিটি প্রশ্নের লেখা, বিবৃতি, অপশন ও সঠিক উত্তর যাচাই করে
          for (const o of subs) {
            if (!(o.text.trim() || o.img)) return alert("প্রশ্ন লেখো");
            if (o.type == "multi" && o.st.some((s) => !s.trim())) return alert("i, ii, iii সব লেখো");
            if (o.opts.some((x) => !x.trim())) return alert("চারটি অপশনই লেখো");
            if (o.ans < 0) return alert("সঠিক উত্তর বাছো");
          }
          // বোর্ড ও সাল জোড়ায় আছে কিনা দেখে
          if ((q.src || []).some((s) => !s.b != !s.y)) return alert("বোর্ড বাছলে সাল বাছো (এবং সাল বাছলে বোর্ড)");
          // অসম্পূর্ণ ও ডুপ্লিকেট উৎস বাদ দেয়
          q.src = (q.src || []).filter((s, i, a) => s.b && s.y && a.findIndex((t) => t.b == s.b && t.y == s.y) == i);
          // ডেটাবেসে সেভ করে (ব্যর্থ হলে সতর্কবার্তা দেয়)
          try {
            await persistQ(q);
          } catch (e) {
            return alert("সেভ ব্যর্থ: " + e.message);
          }
          // তালিকায় থাকলে বদলায়, নাহলে নতুন যোগ করে
          const i = S.q.findIndex((x) => x.id == q.id);
          i < 0 ? S.q.push(q) : S.q[i] = q;
          ed = null;
          draw();
        }

        // সব প্রশ্ন Expand/Collapse টগল করে
        function tgx() {
          EX = !EX;
          $("#lst").innerHTML = lst();
          $("#xb").textContent = EX ? "সব Collapse করো" : "সব Expand করো";
        }

        // এডিটরের প্রশ্নের সব লেখা একত্র করে (ডুপ্লিকেট খোঁজার জন্য)
        const qtxt = () => {
          const o = ed;
          return (o.type == "group" ? [o.stem.text, o.stem.code, ...o.kids.flatMap((k) => [k.text, ...k.st])] : [o.text, ...o.st]).join(" ");
        };

        // ডুপ্লিকেট-চেক প্যানেল ও প্রিভিউ আঁকে
        function sim() {
          const el = $("#sim");
          if (!el || !ed) return;
          sim1(el);
          el.insertAdjacentHTML("afterbegin", "<details open><summary><b>👁 প্রিভিউ</b></summary><div class=pv>" + blk(ed, 1, 1) + "</div></details><hr>");
        }

        // নতুন প্রশ্নের শব্দের সাথে ব্যাংকের প্রশ্ন মিলিয়ে মিল খোঁজে
        function sim1(el) {
          // লেখাকে শব্দে ভাঙে
          const tk = [...new Set(qtxt().toLowerCase().split(/[\s,.;:?!()\[\]{}"'।—\-]+/).filter((x) => x.length > 1))];
          // শব্দ কম হলে নির্দেশনা দেখায়
          if (tk.length < 2) {
            el.innerHTML = "<b>🔎 আগে থেকে আছে কি?</b><p class=mu>প্রশ্ন লিখতে শুরু করলে এখানে ব্যাংকের মিলে যাওয়া প্রশ্ন দেখাবে।</p>";
            return;
          }
          // অন্তত ৫০% শব্দ মিললে সর্বোচ্চ ৮টি প্রশ্ন বাছে
          const r = S.q.filter((q) => q.id != ed.id).map((q) => {
            const h = hay(q);
            return { q, s: tk.filter((t) => h.includes(t)).length / tk.length };
          }).filter((x) => x.s >= 0.5).sort((a, b) => b.s - a.s).slice(0, 8);
          // মিলের ফলাফল (সতর্কতা / মিল আছে / নতুন) ও প্রশ্নের তালিকা দেখায়
          el.innerHTML = (r.length ? r[0].s >= 0.8 ? '<b style="color:#d92d20">⚠ খুব মিল আছে, সম্ভবত আগে থেকেই ব্যাংকে আছে</b>' : "<b>🔎 মিল আছে (" + bn(r.length) + " টি)</b>" : '<b style="color:#12b76a">✅ আগে নেই, নতুন মনে হচ্ছে</b>') + r.map((x) => `<div class=card style="padding:6px 8px"><span class=chip>${bn(Math.round(x.s * 100))}% মিল</span> <span class=chip>${TY[x.q.type]}</span><details><summary>${smh(x.q)}<br><small>${esc(chn(x.q.ch))}${tag(x.q) ? " • " + esc(tag(x.q)) : ""}</small></summary><div class=pv>${blk(x.q, 1, 1)}</div></details><button class=sm onclick="simEdit('${x.q.id}')">এডিট</button></div>`).join("");
        }

        // মিলে যাওয়া প্রশ্ন এডিটে নেয় (না-সেভ লেখা হারানোর আগে নিশ্চিত করে)
        function simEdit(id) {
          if (qtxt().trim() && !confirm("এখন যা লিখেছ তা সেভ না করলে হারিয়ে যাবে। ওই প্রশ্ন এডিট করবে?")) return;
          editQ(id);
          scrollTo(0, 0);
        }

        // প্রশ্নের অপশন কয় কলামে সাজানো যাবে তা মেপে ঠিক করে
        function ml(o, t, W) {
          // মাপার জন্য লুকানো span
          const p = document.createElement("span");
          p.style.cssText = "position:absolute;white-space:nowrap;visibility:hidden";
          t.append(p);
          // একটি HTML-এর প্রস্থ মাপে
          const w = (h) => {
            p.innerHTML = h;
            return p.offsetWidth;
          };
          // কলামের মাঝের ফাঁক (px)
          const g = 7.56;
          // সবচেয়ে চওড়া অপশনের প্রস্থ
          const mx = Math.max(...o.opts.map((x, i) => w(optH(o, i, 1))));
          // ৪, ২ বা ১ কলাম ঠিক করে
          const r = { o: mx <= (W - 3 * g) / 4 ? "l4" : mx <= (W - g) / 2 ? "l2" : "l1" };
          // multi প্রশ্নে বিবৃতিগুলো এক লাইনে ধরে কিনা দেখে
          if (o.type == "multi") r.s = o.st.map((s, i) => w(["i", "ii", "iii"][i] + ". " + rt(s, MX))).reduce((a, b) => a + b, 0) + 2 * g <= W - 8;
          // মাপার span সরায়
          p.remove();
          return r;
        }

        // সেটের প্রশ্নের ক্রম এলোমেলো করে (Fisher–Yates শাফল)
        function shuf() {
          const a = cur.ids;
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          const y = scrollY;
          prev().then(() => scrollTo(0, y));
        }

        // এডিটরের প্রশ্নের LaTeX সাধারণ লেখায় বদলায়
        function cleanAll() {
          const f = (o) => {
            o.text = ltx2txt(o.text);
            o.st = o.st.map((x) => ltx2txt(x));
            o.opts = o.opts.map((x) => ltx2txt(x));
          };
          f(ed);
          ed.kids.forEach(f);
          ed.stem.text = ltx2txt(ed.stem.text);
          draw();
        }

        // multi প্রশ্নের অপশন ডিফল্টে ফেরায়
        function dflt(p) {
          setp(ed, p + "opts", [...MD]);
          draw();
        }

        // কার্সার যেখানে আছে সেখানে চিহ্ন বসায় (প্যালেটের বাটন)
        function ins(c) {
          const e = lf;
          if (!e) return;
          e.setRangeText(c, e.selectionStart, e.selectionEnd, "end");
          e.dispatchEvent(new Event("input", { bubbles: true }));
          if (c == "~{}") e.setSelectionRange(e.selectionEnd - 1, e.selectionEnd - 1);
        }

        // ফাইল ইনপুট থেকে ছবি নেয়
        function upl(inp, k) {
          imgFile(inp.files[0], k);
        }

        // pk = ছবি পেস্টের লক্ষ্য ঘর
        let pk = null;

        // ছবি ছোট (সর্বোচ্চ ৭০০px) করে JPEG ডেটা URL বানায়
        function imgFile(f, k) {
          if (!f || !/^image/.test(f.type)) return;
          const r = new FileReader();
          r.onload = () => {
            const im = new Image();
            im.onload = () => {
              const s = Math.min(1, 700 / im.width);
              const c = document.createElement("canvas");
              c.width = im.width * s;
              c.height = im.height * s;
              c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
              setp(ed, k, c.toDataURL("image/jpeg", 0.75));
              draw();
            };
            im.src = r.result;
          };
          r.readAsDataURL(f);
        }

        // ইভেন্ট ফোকাস: সর্বশেষ ইনপুট ও ছবির লক্ষ্য মনে রাখে
        document.addEventListener("focusin", (e) => {
          const t = e.target;
          if (/INPUT|TEXTAREA/.test(t.tagName) && t.type != "file" && t.type != "checkbox" && t.type != "radio") {
            lf = t;
            const k = t.dataset.k;
            if (k && ed) pk = k.startsWith("stem.") ? "stem.img" : (k.match(/^kids\.\d+\./) || [""])[0] + "img";
          }
        });

        // ইভেন্ট পেস্ট: LaTeX হলে সাধারণ লেখায় বদলায়, ছবি হলে ছবির ঘরে বসায়
        document.addEventListener("paste", (e) => {
          if (!ed) return;
          const tx = e.clipboardData ? e.clipboardData.getData("text") : "";
          const t = e.target;
          if (tx && !ed.mx && /\$|\\[a-zA-Z]/.test(tx) && t.dataset && t.dataset.k && /INPUT|TEXTAREA/.test(t.tagName)) {
            e.preventDefault();
            t.setRangeText(ltx2txt(tx), t.selectionStart, t.selectionEnd, "end");
            t.dispatchEvent(new Event("input", { bubbles: true }));
            return;
          }
          const it = [...e.clipboardData ? e.clipboardData.items : []].find((x) => x.type.startsWith("image"));
          if (!it) return;
          e.preventDefault();
          let k = pk || "img";
          if (ed.type == "group" && k == "img") k = "stem.img";
          imgFile(it.getAsFile(), k);
        });

        // ইভেন্ট ইনপুট: এডিটরের মান আপডেট করে ও প্রিভিউ নবায়ন করে
        document.addEventListener("input", (e) => {
          const k = e.target.dataset && e.target.dataset.k;
          if (!k || !ed) return;
          let v = e.target.type == "checkbox" ? e.target.checked : e.target.value;
          if (/ans$/.test(k)) v = +v;
          setp(ed, k, v);
          if (/(text|code|st\.\d|opts\.\d|ans|mx)$/.test(k)) sim();
        });

        // ইভেন্ট পরিবর্তন: বোর্ড/সাল/টাইপ বদলালে এডিটর নতুন করে আঁকে
        document.addEventListener("change", (e) => {
          const k = e.target.dataset && e.target.dataset.k;
          if (k && ed && /^src\.\d+\.[by]$/.test(k)) {
            draw();
            return;
          }
          if (!k || !ed || !/type$/.test(k)) return;
          // টাইপ বদলালে অপশনের ডিফল্ট ঠিক করে
          if (k.endsWith("type")) {
            const p = k.slice(0, -4);
            const o = p ? ed.kids[+p.split(".")[1]] : ed;
            const emp = o.opts.every((x) => !x.trim());
            const isd = o.opts.join() == MD.join();
            if (o.type == "multi" && emp) o.opts = [...MD];
            if (o.type != "multi" && isd) o.opts = ["", "", "", ""];
          }
          draw();
        });

        // ---------- সেট ----------
        // পরবর্তী সেট কোড বানায় (ZIC-001, ZIC-002 ...)
        const nc = () => {
          const m = Math.max(0, ...S.sets.map((s) => +((s.code || "").match(/(\d+)$/) || [0, 0])[1]));
          return "ZIC-" + String(m + 1).padStart(3, "0");
        };

        // নতুন ফাঁকা সেট খোলে
        function newSet() {
          cur = { id: uid(), code: nc(), name: "", exam: "মডেল টেস্ট", date: "", time: "", marks: "", autoT: true, autoM: true, ids: [], org: DEF_ORG, sub: DEF_SUB, scode: "২৯৫", note: DEF_NOTE };
          go("set");
        }

        // সেভ করা সেট খোলে (ফাঁকা ঘরে ডিফল্ট মান বসায়)
        const openSet = (id) => {
          cur = JSON.parse(JSON.stringify(S.sets.find((s) => s.id == id)));
          cur.code = cur.code || nc();
          cur.org = cur.org ?? DEF_ORG;
          cur.sub = cur.sub ?? DEF_SUB;
          cur.scode = cur.scode ?? "২৯৫";
          cur.note = cur.note ?? DEF_NOTE;
          // সেভ করা সময়/পূর্ণমান অটো মানের সমান হলে অটো চালু, নইলে নিজে বদলানো ধরে রাখে
          cur.autoT = cur.time == autoTime();
          cur.autoM = cur.marks == autoMark();
          go("set");
        };

        // সেট ডুপ্লিকেট করে
        async function dupSet(id) {
          const s = JSON.parse(JSON.stringify(S.sets.find((x) => x.id == id)));
          s.id = uid();
          s.code = nc();
          s.name += " (কপি)";
          try {
            await persistSet(s);
          } catch (e) {
            return alert("সেভ ব্যর্থ: " + e.message);
          }
          S.sets.push(s);
          draw();
        }

        // সেট ডিলিট করে
        async function delSet(id) {
          if (!confirm("সেট ডিলিট করবে?")) return;
          const r = await sb.from("sets").delete().eq("id", id);
          if (r.error) return alert(r.error.message);
          S.sets = S.sets.filter((s) => s.id != id);
          draw();
        }

        // সেট সেভ করে (নাম ও কোড যাচাইসহ)
        async function saveSet() {
          if (!cur.name.trim()) return alert("সেটের নাম দাও");
          cur.code = (cur.code || "").trim() || nc();
          if (S.sets.some((s) => s.id != cur.id && s.code == cur.code)) return alert("এই সেট কোড অন্য সেটে আছে, আলাদা কোড দাও");
          const c = JSON.parse(JSON.stringify(cur));
          try {
            await persistSet(c);
          } catch (e) {
            return alert("সেভ ব্যর্থ: " + e.message);
          }
          const i = S.sets.findIndex((x) => x.id == c.id);
          i < 0 ? S.sets.push(c) : S.sets[i] = c;
          alert("সেট সেভ হয়েছে");
        }

        // প্রশ্ন সেটে যোগ বা বাদ দেয়
        function tog(id, on) {
          const i = cur.ids.indexOf(id);
          if (on && i < 0) cur.ids.push(id);
          if (!on && i >= 0) cur.ids.splice(i, 1);
          $("#sel").innerHTML = selH();
          if (!on && view == "set") $("#lst").innerHTML = lst();
          // প্রশ্ন সংখ্যা বদলেছে, তাই সময় ও পূর্ণমান নবায়ন করে
          syncAuto();
        }

        // অটো সময় ও পূর্ণমান: প্রতি প্রশ্নের জন্য ১ মিনিট ও ১ নম্বর ধরা হয়
        const autoTime = () => bn(cnt()) + " মিনিট";
        const autoMark = () => bn(cnt());

        // অটো চালু থাকা ঘরের মান বর্তমান প্রশ্ন সংখ্যা অনুযায়ী বদলায় ও ঘরে দেখায়
        function syncAuto() {
          if (cur.autoT) cur.time = autoTime();
          if (cur.autoM) cur.marks = autoMark();
          const t = $("#f_time");
          const m = $("#f_marks");
          if (t && t.value != cur.time) t.value = cur.time;
          if (m && m.value != cur.marks) m.value = cur.marks;
          const st = $("#st_time");
          const sk = $("#st_marks");
          if (st) st.textContent = cur.autoT ? "(অটো)" : "(নিজে বদলানো)";
          if (sk) sk.textContent = cur.autoM ? "(অটো)" : "(নিজে বদলানো)";
        }

        // "অটো" বাটন: হাতে বদলানো মান বাদ দিয়ে আবার স্বয়ংক্রিয় করে
        function autoOn(flag) {
          cur[flag] = true;
          syncAuto();
        }

        // সেটে প্রশ্নের ক্রম ওপর-নিচ করে
        function mv(i, d) {
          const j = i + d;
          if (j < 0 || j >= cur.ids.length) return;
          [cur.ids[i], cur.ids[j]] = [cur.ids[j], cur.ids[i]];
          $("#sel").innerHTML = selH();
        }

        // নির্বাচিত অধ্যায় থেকে র‍্যান্ডম প্রশ্ন যোগ করে
        function rnd() {
          const c = $("#rc").value;
          const n = +$("#rn").value;
          if (!c) return alert("অধ্যায় বাছো");
          const pool = S.q.filter((q) => q.ch == c && !cur.ids.includes(q.id)).sort(() => Math.random() - 0.5);
          let a = 0;
          for (const q of pool) {
            if (a >= n) continue;
            cur.ids.push(q.id);
            a += units(q);
          }
          draw();
        }

        // প্রিভিউ খোলে ও লেআউট হিসাব করে
        async function prev() {
          view = "prev";
          draw();
          last = await lay();
          rp();
        }

        // প্রিভিউ আবার আঁকে
        function rp() {
          draw0();
        }

        // ফন্ট সাইজ বাড়ায় বা কমায় (৬–১৬pt)
        function fz(d) {
          cur.fs = Math.max(6, Math.min(16, (cur.fs || last.f) + d));
          prev();
        }

        // হিসাব করা লেআউট অনুযায়ী প্রিভিউ পাতা আঁকে
        function draw0() {
          if (!last) return;
          const pc = Math.ceil(last.cols.length / last.C);
          $("#print").innerHTML = ver == "b" ? pages(last, 0) + pages(last, 1) : pages(last, ver == "a" ? 1 : 0);
          document.querySelectorAll(".nav button").forEach((b) => b.blur());
          const i = $("#inf");
          if (i) i.textContent = `${bn(pc)} পেজ, ফন্ট ${bn(last.f)}pt${cur.fs ? " (ম্যানুয়াল)" : " (অটো)"}${last.over ? " ⚠ প্রশ্ন বেশি লম্বা, ছবি/উদ্দীপক কমাও" : ""}`;
          document.querySelectorAll(".no-print .fl button").forEach((b) => {
            if (["q", "a", "b"].some((v) => b.getAttribute("onclick") == "ver='" + v + "';rp()")) b.classList.toggle("on", b.getAttribute("onclick") == "ver='" + ver + "';rp()");
          });
        }

        // ---------- টেনে ক্রম বদল (ড্র্যাগ) ----------
        // dg = যে প্রশ্নটি টানা হচ্ছে তার সূচক
        let dg = null;

        // সবচেয়ে কাছের টানার যোগ্য প্রশ্ন খুঁজে বের করে
        const cd = (e) => e.target.closest ? e.target.closest(".di") : null;

        // টানা শুরু হলে প্রশ্নের সূচক মনে রাখে
        document.addEventListener("dragstart", (e) => {
          const d = cd(e);
          if (d) {
            dg = +d.dataset.i;
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", "q");
          }
        });

        // টানার সময় লক্ষ্য প্রশ্ন হাইলাইট করে
        document.addEventListener("dragover", (e) => {
          const d = cd(e);
          if (d && dg != null) {
            e.preventDefault();
            document.querySelectorAll(".di.ov").forEach((x) => x.classList.remove("ov"));
            d.classList.add("ov");
          }
        });

        // ছেড়ে দিলে প্রশ্নের ক্রম বদলে পুনরায় আঁকে
        document.addEventListener("drop", (e) => {
          const d = cd(e);
          if (!d || dg == null) return;
          e.preventDefault();
          const j = +d.dataset.i;
          const i = dg;
          dg = null;
          if (i == j) return;
          const U = last.U;
          const a = cur.ids.indexOf(U[i].q.id);
          const b = cur.ids.indexOf(U[j].q.id);
          cur.ids.splice(b, 0, cur.ids.splice(a, 1)[0]);
          const y = scrollY;
          prev().then(() => scrollTo(0, y));
        });

        // টানা শেষ হলে হাইলাইট সরায়
        document.addEventListener("dragend", () => {
          dg = null;
          document.querySelectorAll(".di.ov").forEach((x) => x.classList.remove("ov"));
        });

        // ---------- ব্যাকআপ ----------
        // সব ডেটা JSON হিসেবে Export করে ও ক্লিপবোর্ডে কপি করে
        function exp() {
          const t = JSON.stringify(S);
          $("#bk").value = t;
          $("#bk").select();
          try {
            navigator.clipboard.writeText(t);
          } catch (e) {
          }
        }

        // JSON ব্যাকআপ ডেটাবেসে Import করে
        async function imp() {
          // টেক্সটবক্সের JSON পড়ে সঠিক কিনা যাচাই করে
          let d;
          try {
            d = JSON.parse($("#bk").value);
            if (!d.ch || !d.q) throw 0;
          } catch (e) {
            return alert("সঠিক JSON নয়");
          }
          // ব্যবহারকারীর নিশ্চিতকরণ চায়
          if (!confirm('এই JSON-এর সব অধ্যায়, প্রশ্ন ও সেট ডেটাবেসে যোগ হবে (বর্তমান ডেটা থাকবে)। পুরোনো "বোর্ড" লেখা থেকে বোর্ড ও সাল নিজে থেকে তৈরি হবে। একই JSON দুবার দিলে ডুপ্লিকেট হবে। চালিয়ে যাবে?')) return;
          // m = পুরোনো আইডি → নতুন আইডি মানচিত্র
          const m = {};
          // নতুন আইডি দেয় (একই পুরোনো আইডিতে একই নতুন আইডি)
          const nid = (o) => m[o] = m[o] || uid();
          // ইমপোর্টের অগ্রগতি দেখায়
          const ip = (t) => {
            const e = $("#ip");
            if (e) e.textContent = t;
          };
          // codes = বিদ্যমান সেট কোড (ডুপ্লিকেট এড়াতে)
          const codes = new Set(S.sets.map((x) => x.code));
          // bad = বোঝা যায়নি এমন বোর্ড লেখা
          const bad = new Set();
          // bm ও ym = বোর্ড ও সালের পুরোনো → নতুন আইডি
          const bm = {};
          const ym = {};
          try {
            // অধ্যায় Import করে
            for (const c of d.ch) {
              const r = await sb.from("chapters").upsert({ id: nid(c.id), num: c.n, name: c.name });
              if (r.error) throw r.error;
            }
            // বোর্ড Import করে
            for (const b of d.boards || []) bm[b.id] = await ensB(b.name, b.sn || b.shortname);
            // সাল Import করে
            for (const y of d.years || []) ym[y.id] = await ensY(y.y || y.year, y.sy || y.shortyear);
            // প্রশ্ন Import শুরু (n = গণনা)
            let n = 0;
            for (const q of d.q) {
              // প্রশ্ন ও উপপ্রশ্নের নতুন আইডি বসায়
              q.id = nid(q.id);
              q.ch = nid(q.ch);
              (q.kids || []).forEach((k) => k.id = uid());
              // প্রশ্নের উৎস (বোর্ড ও সাল) তৈরি করে
              let src = [];
              // নতুন ধরনের src তালিকা থেকে
              if (Array.isArray(q.src)) src = q.src.filter((x) => bm[x.b] && ym[x.y]).map((x) => ({ b: bm[x.b], y: ym[x.y] }));
              // পুরোনো "board" লেখা থেকে বোর্ড ও সাল বের করে
              else if (q.board) {
                const tk = String(q.board).split(",");
                const ps = pbs(q.board);
                for (let i = 0; i < ps.length; i++) {
                  const p = ps[i];
                  if (!p) {
                    if (tk[i].trim()) bad.add(tk[i].trim());
                    continue;
                  }
                  const yy = p.d.length <= 2 ? (/[০-৯]/.test(p.d) ? "২০" : "20") + p.d : p.d;
                  src.push({ b: await ensB(p.a, p.a + ": বো:"), y: await ensY(yy, p.d) });
                }
              }
              // প্রশ্ন ডেটাবেসে সেভ করে ও অগ্রগতি দেখায়
              q.src = src;
              delete q.board;
              await persistQ(q);
              ip("প্রশ্ন " + bn(++n) + "/" + bn(d.q.length));
            }
            // সেট Import করে (কোড মিলে গেলে আগে IMP- বসায়)
            for (const s of d.sets || []) {
              s.id = nid(s.id);
              s.ids = (s.ids || []).filter((i) => m[i]).map(nid);
              if (codes.has(s.code)) s.code = "IMP-" + s.code;
              codes.add(s.code);
              await persistSet(s);
            }
            // নতুন ডেটা লোড করে, পুনরায় আঁকে ও শেষ বার্তা দেখায়
            await load();
            draw();
            alert("ইমপোর্ট শেষ" + (bad.size ? "। এই বোর্ড লেখাগুলো বোঝা যায়নি, হাতে ঠিক করো: " + [...bad].join(" | ") : ""));
          // ব্যর্থ হলে ত্রুটির বার্তা দেখায়
          } catch (e) {
            ip("");
            alert("ইমপোর্ট ব্যর্থ: " + (e.message || e) + "। কিছু ডেটা ঢুকে থাকতে পারে।");
          }
        }

        // ফাইল থেকে JSON পড়ে টেক্সটবক্সে বসায়
        function fi(i) {
          const f = i.files[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = () => {
            $("#bk").value = r.result;
          };
          r.readAsText(f);
        }

        // ---------- বোর্ড ও সাল ----------
        // বোর্ডের আইডি থেকে সংক্ষিপ্ত নাম
        const bsn = (id) => {
          const b = S.boards.find((x) => x.id == id);
          return b ? b.sn : "";
        };

        // সালের আইডি থেকে সংক্ষিপ্ত রূপ
        const ysn = (id) => {
          const y = S.years.find((x) => x.id == id);
          return y ? y.sy : "";
        };

        // প্রশ্নের বোর্ড-সাল ট্যাগ (যেমন ঢা: বো: ’২৫)
        const tag = (q) => (q.src || []).map((s) => bsn(s.b) + " ’" + ysn(s.y)).join(", ");

        // বাংলা অঙ্ককে ইংরেজি অঙ্কে বদলায় (তুলনার জন্য)
        const tEn = (s) => String(s).replace(/[০-৯]/g, (c) => "০১২৩৪৫৬৭৮৯".indexOf(c));

        // বোর্ডের সংক্ষিপ্ত নাম থেকে স্পেস, চিহ্ন ও "বো" বাদ দিয়ে তুলনার উপযোগী করে
        const bnorm = (s) => String(s || "").replace(/[\s:.]/g, "").replace(/বো$/, "");

        // বোর্ড আছে কিনা দেখে, না থাকলে ডেটাবেসে যোগ করে আইডি ফেরত দেয়
        async function ensB(name, sn) {
          const k = bnorm(sn);
          const b = S.boards.find((x) => bnorm(x.sn) == k);
          if (b) return b.id;
          const id = uid();
          const r = await sb.from("boards").insert({ id, name: name || sn, shortname: sn });
          if (r.error) throw r.error;
          S.boards.push({ id, name: name || sn, sn });
          return id;
        }

        // সাল আছে কিনা দেখে, না থাকলে ডেটাবেসে যোগ করে আইডি ফেরত দেয়
        async function ensY(y, sy) {
          const k = tEn(sy);
          const o = S.years.find((x) => tEn(x.sy) == k);
          if (o) return o.id;
          const id = uid();
          const r = await sb.from("years").insert({ id, year: y, shortyear: sy });
          if (r.error) throw r.error;
          S.years.push({ id, y, sy });
          return id;
        }

        // "ঢা: বো: ’২৫" ধরনের লেখা থেকে বোর্ড ও সাল আলাদা করে
        const pbs = (s) => String(s || "").split(",").map((t) => {
          const m = t.replace(/[‘’'`]/g, "'").match(/^\s*(\S+?)\s*[:.]?\s*বো\s*[:.]?\s*'?\s*([০-৯0-9]+)\s*$/);
          return m ? { a: m[1], d: m[2] } : null;
        });

        // প্রশ্নের উৎস বোর্ড ও সালের নির্বাচন অংশের HTML
        const srcF = (q) => `<label>উৎস বোর্ড ও সাল (ঐচ্ছিক; বোর্ড বাছলে সাল বাধ্যতামূলক)</label>` + (q.src || []).map((s, i) => `<div class=r><select data-k="src.${i}.b">${opt([["", "-- বোর্ড --"], ...S.boards.map((b) => [b.id, b.name])], s.b)}</select><select data-k="src.${i}.y">${opt([["", "-- সাল --"], ...S.years.map((y) => [y.id, y.y])], s.y)}</select><button class=sm onclick="ed.src.splice(${i},1);draw()">✕</button></div>`).join("") + `<button class=sm onclick="ed.src.push({b:'',y:''});draw()">+ বোর্ড যোগ করো</button>${tag(q) ? " <small class=mu>ট্যাগ: [" + esc(tag(q)) + "]</small>" : ""}`;

        // একটি বোর্ডে কয়টি প্রশ্ন আছে
        const cntB = (id) => S.q.filter((q) => (q.src || []).some((s) => s.b == id)).reduce((a, q) => a + units(q), 0);

        // একটি সালে কয়টি প্রশ্ন আছে
        const cntY = (id) => S.q.filter((q) => (q.src || []).some((s) => s.y == id)).reduce((a, q) => a + units(q), 0);

        // বোর্ড ও সাল ব্যবস্থাপনার পাতা
        function vR() {
          return `<div class=two><div><h3>বোর্ড</h3><div class=card><div class=fl><input id=ib1 class=s placeholder="নাম (ঢাকা)"><input id=ib2 placeholder="সংক্ষিপ্ত (ঢা: বো:)" style="width:140px"><button class=pr onclick="addB()">যোগ</button></div></div>${S.boards.map((b) => `<div class=row><span>${esc(b.name)} <small>(${esc(b.sn)}) • ${bn(cntB(b.id))} প্রশ্ন</small></span><span style="white-space:nowrap"><button class=sm onclick="editB('${b.id}')">এডিট</button> <button class=sm onclick="delB('${b.id}')">ডিলিট</button></span></div>`).join("")}</div><div><h3>সাল</h3><div class=card><div class=fl><input id=iy1 class=s placeholder="সাল (২০২৫)"><input id=iy2 placeholder="সংক্ষিপ্ত (২৫)" style="width:110px"><button class=pr onclick="addY()">যোগ</button></div></div>${S.years.map((y) => `<div class=row><span>${esc(y.y)} <small>(${esc(y.sy)}) • ${bn(cntY(y.id))} প্রশ্ন</small></span><span style="white-space:nowrap"><button class=sm onclick="editY('${y.id}')">এডিট</button> <button class=sm onclick="delY('${y.id}')">ডিলিট</button></span></div>`).join("")}</div></div>`;
        }

        // সেভ করা সেটের তালিকার পাতা
        function vL() {
          // একটি সেটে মোট প্রশ্ন সংখ্যা
          const q2 = (s) => s.ids.reduce((a, id) => {
            const q = S.q.find((x) => x.id == id);
            return a + (q ? units(q) : 0);
          }, 0);
          // নতুন সেট বাটন ও কোড অনুযায়ী সাজানো সেটের সারি
          return `<div class=fl style="justify-content:space-between"><h3 style="margin:0">সেভ করা সেট</h3><button class=pr onclick="newSet()">+ নতুন সেট</button></div>` + (S.sets.length ? [...S.sets].sort((a, b) => String(a.code).localeCompare(String(b.code), undefined, { numeric: true })).map((s) => `<div class=row><span><span class=chip>${esc(s.code || "—")}</span> ${esc(s.name)} <small>• ${bn(q2(s))} টি প্রশ্ন</small></span><span style="white-space:nowrap"><button class=sm onclick="openSet('${s.id}');prev()">প্রিভিউ</button> <button class=sm onclick="openSet('${s.id}')">এডিট</button> <button class=sm onclick="dupSet('${s.id}')">ডুপ্লিকেট</button> <button class=sm onclick="delSet('${s.id}')">ডিলিট</button></span></div>`).join("") : "<p class=mu>এখনো কোনো সেট নেই।</p>");
        }

        // নতুন বোর্ড যোগ করে
        async function addB() {
          const n = $("#ib1").value.trim();
          const s = $("#ib2").value.trim();
          if (!n || !s) return alert("নাম ও সংক্ষিপ্ত নাম দুটোই দাও");
          const id = uid();
          const r = await sb.from("boards").insert({ id, name: n, shortname: s });
          if (r.error) return alert(r.error.message);
          S.boards.push({ id, name: n, sn: s });
          draw();
        }

        // বোর্ডের নাম ও সংক্ষিপ্ত নাম এডিট করে
        async function editB(id) {
          const b = S.boards.find((x) => x.id == id);
          const n = prompt("বোর্ডের নাম", b.name);
          if (n === null) return;
          const s = prompt("সংক্ষিপ্ত নাম", b.sn);
          if (s === null) return;
          const r = await sb.from("boards").update({ name: n, shortname: s }).eq("id", id);
          if (r.error) return alert(r.error.message);
          b.name = n;
          b.sn = s;
          draw();
        }

        // বোর্ড ডিলিট করে (প্রশ্নে ব্যবহার হলে আটকায়)
        async function delB(id) {
          if (cntB(id)) return alert("এই বোর্ড প্রশ্নে ব্যবহার হচ্ছে, আগে সেখান থেকে সরাও");
          if (!confirm("বোর্ড ডিলিট করবে?")) return;
          const r = await sb.from("boards").delete().eq("id", id);
          if (r.error) return alert(r.error.message);
          S.boards = S.boards.filter((b) => b.id != id);
          draw();
        }

        // নতুন সাল যোগ করে
        async function addY() {
          const n = $("#iy1").value.trim();
          const s = $("#iy2").value.trim();
          if (!n || !s) return alert("সাল ও সংক্ষিপ্ত রূপ দুটোই দাও");
          const id = uid();
          const r = await sb.from("years").insert({ id, year: n, shortyear: s });
          if (r.error) return alert(r.error.message);
          S.years.push({ id, y: n, sy: s });
          S.years.sort((a, b) => String(b.y).localeCompare(String(a.y)));
          draw();
        }

        // সালের নাম ও সংক্ষিপ্ত রূপ এডিট করে
        async function editY(id) {
          const y = S.years.find((x) => x.id == id);
          const n = prompt("সাল", y.y);
          if (n === null) return;
          const s = prompt("সংক্ষিপ্ত রূপ", y.sy);
          if (s === null) return;
          const r = await sb.from("years").update({ year: n, shortyear: s }).eq("id", id);
          if (r.error) return alert(r.error.message);
          y.y = n;
          y.sy = s;
          draw();
        }

        // সাল ডিলিট করে (প্রশ্নে ব্যবহার হলে আটকায়)
        async function delY(id) {
          if (cntY(id)) return alert("এই সাল প্রশ্নে ব্যবহার হচ্ছে, আগে সেখান থেকে সরাও");
          if (!confirm("সাল ডিলিট করবে?")) return;
          const r = await sb.from("years").delete().eq("id", id);
          if (r.error) return alert(r.error.message);
          S.years = S.years.filter((y) => y.id != id);
          draw();
        }

        // ---------- Supabase (ডেটাবেস) ----------
        // Supabase-এর URL ও কী (ফাঁকা থাকলে লগইনের আগে ইনপুট নেয়)
        const SB_URL = "";
        const SB_KEY = "";

        // sb = Supabase ক্লায়েন্ট
        let sb = null;

        // সংযোগের তথ্য নেয় (কোডের মান, নাহলে localStorage থেকে)
        const cfg = () => ({ u: SB_URL || localStorage.getItem("zic_u") || "", k: SB_KEY || localStorage.getItem("zic_k") || "" });

        // ছবি রাখার স্টোরেজ বাকেটের নাম
        const BK = "question-images";

        // একটি টেবিলের সব সারি ১০০০টি করে ভাগে ভাগে আনে
        async function all(t) {
          let a = [];
          let f = 0;
          for (; ; ) {
            const r = await sb.from(t).select("*").order("id").range(f, f + 999);
            if (r.error) throw r.error;
            a = a.concat(r.data);
            if (r.data.length < 1000) return a;
            f += 1000;
          }
        }

        // ডেটাবেসের সারি → উপপ্রশ্নের অবজেক্ট
        const r2s = (r) => ({ id: r.id, type: r.type, text: r.qtext || "", img: r.img || "", st: r.statements && r.statements.length ? r.statements : ["", "", ""], opts: r.options && r.options.length ? r.options : ["", "", "", ""], ans: r.answer == null ? -1 : r.answer });

        // ডেটাবেসের সারি → পূর্ণ প্রশ্নের অবজেক্ট
        const q2o = (r, k) => ({ ...r2s(r), ch: r.chapter_id, src: (SRC[r.id] || []).slice(), note: r.note || "", mx: !!r.math, stem: r.stem || { pre: PRE[0], text: "", code: "", img: "" }, kids: k.length ? k.map(r2s) : [ns()] });

        // প্রশ্নের অবজেক্ট → ডেটাবেসের সারি
        const o2r = (o, q, par, pos) => ({ id: o.id, chapter_id: q.ch, parent_id: par, pos, type: o.type, qtext: o.text || "", img: o.img || null, statements: o.st || [], options: o.opts || [], answer: o.type != "group" && o.ans >= 0 ? o.ans : null, math: !!q.mx, note: q.note || "", stem: o.type == "group" ? q.stem : null });

        // ডেটাবেস থেকে সব ডেটা লোড করে S-এ বসায়
        async function load() {
          // সাতটি টেবিলের ডেটা একসাথে আনে
          const [c, q, s, it, bd, yr, qs] = await Promise.all([all("chapters"), all("questions"), all("sets"), all("set_items"), all("boards"), all("years"), all("question_sources")]);
          // বোর্ড (নাম অনুযায়ী) ও সাল (নতুন আগে) সাজিয়ে বসায়
          S.boards = bd.map((x) => ({ id: x.id, name: x.name, sn: x.shortname })).sort((a, b) => a.name.localeCompare(b.name, "bn"));
          S.years = yr.map((x) => ({ id: x.id, y: x.year, sy: x.shortyear })).sort((a, b) => String(b.y).localeCompare(String(a.y)));
          // প্রশ্নের উৎস মানচিত্র তৈরি করে
          SRC = {};
          qs.sort((a, b) => a.id - b.id).forEach((x) => (SRC[x.question_id] = SRC[x.question_id] || []).push({ b: x.board_id, y: x.year_id }));
          // অধ্যায় বসায়
          S.ch = c.map((x) => ({ id: x.id, n: x.num, name: x.name }));
          // প্রশ্নগুলো তৈরির সময় অনুযায়ী সাজায়
          q.sort((a, b) => a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : 0);
          // উদ্দীপকের উপপ্রশ্নগুলো মূল প্রশ্নের সাথে জোড়া দেয়
          const kids = {};
          q.filter((x) => x.parent_id).forEach((x) => (kids[x.parent_id] = kids[x.parent_id] || []).push(x));
          // মূল প্রশ্নগুলো অবজেক্টে বদলায়
          S.q = q.filter((x) => !x.parent_id).map((x) => q2o(x, (kids[x.id] || []).sort((a, b) => a.pos - b.pos)));
          // সেটের প্রশ্নের তালিকা (পজিশন অনুযায়ী) বানায়
          const m = {};
          it.sort((a, b) => a.pos - b.pos).forEach((x) => (m[x.set_id] = m[x.set_id] || []).push(x.question_id));
          // সেটগুলো বসায়
          S.sets = s.map((x) => ({ id: x.id, code: x.code, name: x.name, exam: x.exam, date: x.exam_date, time: x.exam_time, marks: x.marks, bt: x.board_tag, fs: x.font_size == null ? null : +x.font_size, org: (x.meta || {}).org, sub: (x.meta || {}).sub, scode: (x.meta || {}).scode, note: (x.meta || {}).note, cc: (x.meta || {}).cc, ids: m[x.id] || [] }));
        }

        // ছবি ডেটা URL হলে Storage-এ আপলোড করে পাবলিক URL ফেরত দেয়
        async function upImg(u) {
          if (!u || !u.startsWith("data:")) return u;
          const b = await (await fetch(u)).blob();
          const p = uid() + ".jpg";
          const r = await sb.storage.from(BK).upload(p, b, { contentType: "image/jpeg" });
          if (r.error) throw r.error;
          return sb.storage.from(BK).getPublicUrl(p).data.publicUrl;
        }

        // প্রশ্ন (ও উপপ্রশ্ন, উৎস) ডেটাবেসে সেভ করে
        async function persistQ(q) {
          // ছবিগুলো আপলোড করে
          q.img = await upImg(q.img);
          q.stem.img = await upImg(q.stem.img);
          for (const k of q.kids) k.img = await upImg(k.img);
          // g = উদ্দীপক কিনা
          const g = q.type == "group";
          // ডেটাবেসের সারিগুলো প্রস্তুত করে
          const rows = [o2r(q, q, null, 0)];
          if (g) q.kids.forEach((k, i) => {
            k.id = k.id || uid();
            rows.push(o2r(k, q, q.id, i + 1));
          });
          // প্রশ্ন সেভ বা আপডেট করে
          let r = await sb.from("questions").upsert(rows);
          if (r.error) throw r.error;
          // বাদ পড়া উপপ্রশ্ন মুছে ফেলে
          r = g ? await sb.from("questions").delete().eq("parent_id", q.id).not("id", "in", "(" + q.kids.map((k) => k.id).join(",") + ")") : await sb.from("questions").delete().eq("parent_id", q.id);
          if (r.error) throw r.error;
          // আগের উৎস মুছে নতুন উৎস বসায়
          r = await sb.from("question_sources").delete().eq("question_id", q.id);
          if (r.error) throw r.error;
          if ((q.src || []).length) {
            r = await sb.from("question_sources").insert(q.src.map((s) => ({ question_id: q.id, board_id: s.b, year_id: s.y })));
            if (r.error) throw r.error;
          }
        }

        // সেট ও তার প্রশ্নের তালিকা ডেটাবেসে সেভ করে
        async function persistSet(s) {
          let r = await sb.from("sets").upsert({ id: s.id, code: s.code, name: s.name, exam: s.exam || "", exam_date: s.date || "", exam_time: s.time || "", marks: s.marks || "", board_tag: !!s.bt, font_size: s.fs || null, meta: { org: s.org, sub: s.sub, scode: s.scode, note: s.note, cc: s.cc } });
          if (r.error) throw r.error;
          // আগের সেট-আইটেম মুছে নতুনগুলো বসায়
          r = await sb.from("set_items").delete().eq("set_id", s.id);
          if (r.error) throw r.error;
          if (s.ids.length) {
            r = await sb.from("set_items").insert(s.ids.map((id, i) => ({ set_id: s.id, question_id: id, pos: i })));
            if (r.error) throw r.error;
          }
        }

        // ---------- সংযোগ ও লগইন ----------
        // Supabase সংযোগের তথ্য নেওয়ার ফর্ম
        function setup() {
          $("#app").innerHTML = `<div class=wrap><div class=card style="max-width:480px;margin:40px auto"><h3>Supabase সংযোগ</h3><label>Project URL</label><input id=su placeholder="https://xxxx.supabase.co"><label>anon public key</label><input id=sk><p class=mu>service_role কী এখানে কখনো দিও না।</p><button class=pr onclick="saveCfg()">সংরক্ষণ</button></div></div>`;
        }

        // সংযোগের তথ্য সংরক্ষণ করে পাতা রিলোড করে
        function saveCfg() {
          localStorage.setItem("zic_u", $("#su").value.trim());
          localStorage.setItem("zic_k", $("#sk").value.trim());
          location.reload();
        }

        // লগইন ফর্ম দেখায় (ভুল হলে বার্তাসহ)
        function loginV(msg) {
          $("#app").innerHTML = `<div class=wrap><div class=card style="max-width:380px;margin:40px auto"><h3>Zenith ICT Care – অ্যাডমিন লগইন</h3><label>ইমেইল</label><input id=le type=email><label>পাসওয়ার্ড</label><input id=lp type=password onkeydown="if(event.key=='Enter')login()"><p style="color:#d92d20">${esc(msg || "")}</p><button class=pr onclick="login()">লগইন</button></div></div>`;
        }

        // ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করে
        async function login() {
          const r = await sb.auth.signInWithPassword({ email: $("#le").value.trim(), password: $("#lp").value });
          if (r.error) return loginV("লগইন ব্যর্থ: " + r.error.message);
          after();
        }

        // লগইনের পর অ্যাডমিন কিনা যাচাই করে ও ডেটা লোড করে
        async function after() {
          // ব্যবহারকারী admins টেবিলে আছে কিনা দেখে
          const r = await sb.from("admins").select("user_id").limit(1);
          if (r.error || !r.data.length) {
            const em = r.error ? r.error.message : "admins টেবিলে এই ব্যবহারকারী নেই";
            await sb.auth.signOut();
            return loginV("এই অ্যাকাউন্টে অ্যাডমিন অনুমতি নেই (" + em + ")");
          }
          // ডেটা লোড হচ্ছে বার্তা দেখায়
          $("#app").innerHTML = "<div class=wrap><p class=mu>ডেটা লোড হচ্ছে...</p></div>";
          try {
            await load();
          } catch (e) {
            return $("#app").innerHTML = '<div class=wrap><p style="color:#d92d20">ডেটা লোড ব্যর্থ: ' + esc(e.message) + "</p></div>";
          }
          draw();
        }

        // অ্যাপ চালু করে: সংযোগের তথ্য ও লগইন সেশন দেখে
        async function boot() {
          const c = cfg();
          if (!c.u || !c.k) return setup();
          sb = supabase.createClient(c.u, c.k);
          const s = await sb.auth.getSession();
          if (!s.data.session) return loginV();
          after();
        }

        // লগআউট করে পাতা রিলোড করে
        function logout() {
          sb.auth.signOut().then(() => location.reload());
        }

        // অ্যাপ চালু
        boot();
    </script>
</body>
