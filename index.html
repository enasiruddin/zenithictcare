<!DOCTYPE html>
<!-- Zenith ICT Care – প্রশ্নব্যাংক: একটি ফাইলেই HTML + CSS + JavaScript -->
<!-- (এখানে প্রশ্ন, অধ্যায়, সেট ও বোর্ড-সাল পরিচালনা এবং A4 প্রশ্নপত্র প্রিন্টের ব্যবস্থা আছে) -->
<html lang="bn">

<!-- হেড অংশ: মেটা তথ্য, ফন্ট ও CSS -->
<head>
    <!-- বাংলা লেখার জন্য UTF-8 এনকোডিং -->
    <meta charset="utf-8">
    <!-- মোবাইলে সঠিক মাপ ও সেফ-এরিয়া সাপোর্ট -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!-- ব্রাউজার ট্যাবের শিরোনাম -->
    <title>Zenith ICT Care – প্রশ্নব্যাংক</title>
    <!-- Google Fonts থেকে Noto Sans Bengali ফন্ট -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
    <!-- ---------- CSS স্টাইল শুরু ---------- -->
    <style>
        /* থিমের রঙের ভ্যারিয়েবল (লাইট থিম) ও সেফ-এরিয়া প্যাডিং */
        :root {
            --bg: #f4f6fa;
            --fg: #1c2330;
            --card: #fff;
            --mu: #667085;
            --bd: #d9dee7;
            --ac: #1f6feb;
            --ac2: #e8f0fe;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        /* সিস্টেম ডার্ক মোড হলে ডার্ক থিমের রঙ */
        @media (prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --bg: #12161d;
                --fg: #e6e9ef;
                --card: #1b212b;
                --mu: #98a2b3;
                --bd: #2d3644;
                --ac: #6ea8ff;
                --ac2: #1d2a44;
                color-scheme: dark
            }
        }

        /* হাতে ডার্ক থিম সেট করা থাকলে ডার্ক রঙ */
        :root[data-theme=dark] {
            --bg: #12161d;
            --fg: #e6e9ef;
            --card: #1b212b;
            --mu: #98a2b3;
            --bd: #2d3644;
            --ac: #6ea8ff;
            --ac2: #1d2a44;
            color-scheme: dark
        }

        /* সব এলিমেন্টে box-sizing ঠিক করা */
        * {
            box-sizing: border-box
        }

        /* স্ক্রল করার সময় ওপরের সেফ-এরিয়া ছাড়া */
        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        /* পাতার সাধারণ ব্যাকগ্রাউন্ড, রঙ ও ফন্ট */
        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 15px/1.5 'Noto Sans Bengali', system-ui, sans-serif
        }

        /* ওপরের নেভিগেশন বার (স্টিকি) */
        .nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 10px 14px;
            background: var(--card);
            border-bottom: 1px solid var(--bd);
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 5;
            align-items: center
        }

        /* নেভিগেশনের লোগো/শিরোনাম */
        .nav b {
            margin-right: 10px;
            color: var(--ac)
        }

        /* মূল কনটেন্টের ঢাকনা (সর্বোচ্চ ১০০০px) */
        .wrap {
            max-width: 1000px;
            margin: 0 auto;
            padding: 14px
        }

        /* সাধারণ বাটনের স্টাইল */
        button {
            font: inherit;
            border: 1px solid var(--bd);
            background: var(--card);
            color: var(--fg);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer
        }

        /* সক্রিয় (on) ও প্রধান (pr) বাটন */
        button.on,
        button.pr {
            background: var(--ac);
            color: #fff;
            border-color: var(--ac)
        }

        /* নিষ্ক্রিয় বাটন */
        button:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        /* ছোট বাটন */
        button.sm {
            padding: 2px 8px;
            font-size: 13px
        }

        /* ইনপুট, সিলেক্ট ও টেক্সটএরিয়ার স্টাইল */
        input,
        select,
        textarea {
            font: inherit;
            color: var(--fg);
            background: var(--bg);
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 6px 8px;
            width: 100%
        }

        /* রেডিও ও চেকবক্সের প্রস্থ স্বাভাবিক রাখা */
        input[type=radio],
        input[type=checkbox] {
            width: auto
        }

        /* লেবেলের স্টাইল */
        label {
            display: block;
            font-size: 13px;
            color: var(--mu);
            margin-top: 8px
        }

        /* কার্ড ও সারির সাধারণ স্টাইল */
        .card,
        .row {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 10px 12px;
            margin: 8px 0
        }

        /* সারি: ডানে-বামে ভাগ করা বিন্যাস */
        .row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            justify-content: space-between
        }

        /* সারির ভেতরের details অংশ জায়গা নেয় */
        .row details {
            flex: 1
        }

        /* ড্যাশবোর্ডের কার্ডের গ্রিড */
        .g3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px
        }

        /* কার্ডের বড় সংখ্যা */
        .g3 .card b {
            font-size: 26px;
            display: block
        }

        /* ছোট ট্যাগ (chip) */
        .chip {
            background: var(--ac2);
            color: var(--ac);
            border-radius: 6px;
            padding: 0 6px;
            font-size: 12px;
            white-space: nowrap
        }

        /* ম্লান (muted) লেখার রঙ */
        .mu,
        small {
            color: var(--mu)
        }

        /* সারিতে সাজানো ইনপুট (রেডিও ও অপশন) */
        .r {
            display: flex;
            gap: 6px;
            align-items: center;
            margin: 4px 0
        }

        /* ফিল্টার বারের ফ্লেক্স সারি */
        .fl {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }

        /* ফ্লেক্স সারির ভেতরের এলিমেন্টের প্রস্থ স্বয়ংক্রিয় */
        .fl>* {
            width: auto
        }

        /* সার্চ ইনপুট জায়গা নেয় */
        .fl input.s {
            flex: 1;
            min-width: 150px
        }

        /* দুই কলামের বিন্যাস */
        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        /* ছোট স্ক্রিনে দুই কলাম এক কলাম হয় */
        @media(max-width:700px) {
            .two {
                grid-template-columns: 1fr
            }
        }

        /* চিহ্নের প্যালেট */
        .pal {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin: 6px 0
        }

        /* প্রিভিউ অংশের ওপরে রেখা */
        .pv {
            padding: 6px;
            border-top: 1px solid var(--bd);
            margin-top: 6px
        }

        /* প্রিন্ট প্রিভিউ এলাকা: চওড়া হলে আড়াআড়ি স্ক্রল */
        #print {
            overflow-x: auto
        }

        /* মাপার জন্য লুকানো এলাকা (স্ক্রিনের বাইরে) */
        #meas {
            position: absolute;
            left: -99999px;
            top: 0
        }

        /* পাতা ও মাপার এলাকার ফন্ট ও রঙ */
        .pg,
        .mz {
            font-family: 'Noto Sans Bengali', sans-serif;
            line-height: 1.35;
            color: #000
        }

        /* A4 পাতার মাপ ও স্টাইল */
        .pg {
            width: 210mm;
            height: 297mm;
            padding: 9mm;
            background: #fff;
            margin: 12px auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 2px 12px #0004
        }

        /* লেখা মাপার লুকানো বক্স */
        .mz {
            position: absolute;
            visibility: hidden
        }

        /* পাতার কলামগুলোর ঢাকনা */
        .cols {
            flex: 1;
            display: flex;
            gap: 4mm;
            min-height: 0
        }

        /* একটি কলাম (ডানে বিভাজক রেখা) */
        .col {
            flex: 1;
            min-width: 0;
            overflow: visible;
            clip-path: inset(0 0 0 -2mm);
            border-right: .3mm solid #999;
            padding-right: 2mm
        }

        /* শেষ কলামে বিভাজক নেই */
        .col:last-child {
            border: 0
        }

        /* প্রতিষ্ঠানের নাম (বড় শিরোনাম) */
        .h1 {
            font-size: 2.3em;
            font-weight: 700;
            text-align: center;
            line-height: 1.1
        }

        /* পরীক্ষার নাম ও উপশিরোনাম মাঝখানে */
        .h3,
        .h4 {
            text-align: center
        }

        /* পরীক্ষার নাম বোল্ড ও বড় */
        .h3 {
            font-weight: 700;
            font-size: 1.15em
        }

        /* "উত্তরসহ" লেবেলের বর্ডার */
        .bd {
            border: .3mm solid #000;
            padding: 0 2mm;
            font-size: .8em
        }

        /* সময়, বিষয় কোড, তারিখ ও পূর্ণমানের সারি */
        .meta {
            display: flex;
            justify-content: space-between;
            border-top: .3mm solid #000;
            border-bottom: .3mm solid #000;
            margin: 1.5mm 0;
            padding: .5mm 0;
            font-weight: 700
        }

        /* বিশেষ দ্রষ্টব্যের লেখা (ইটালিক) */
        .sp {
            font-size: .78em;
            font-style: italic;
            margin-bottom: 2mm
        }

        /* পরের পাতার ছোট হেডার */
        .h2 {
            font-weight: 700;
            border-bottom: .3mm solid #000;
            margin-bottom: 2mm;
            font-size: 1em
        }

        /* একটি প্রশ্নের গ্রিড (নম্বর ও প্রশ্ন) */
        .qn {
            padding-bottom: 1.8mm;
            white-space: pre-wrap;
            display: grid;
            grid-template-columns: 1.9em minmax(0, 1fr)
        }

        /* উদ্দীপক ব্লক: ফাঁকা নম্বর-কলাম নেই, লেখা নম্বরের অবস্থান থেকেই শুরু হয় */
        .qn.qs {
            grid-template-columns: minmax(0, 1fr);
            margin-left: -1.2mm
        }

        /* প্রশ্নের নম্বর (একটু বামে সরানো) */
        .qno {
            font-weight: 700;
            margin-left: -1.2mm
        }

        /* প্রশ্নের অংশ */
        .qb {
            min-width: 0
        }

        /* উদ্দীপকের ঘোষণা লাইনে জাস্টিফাই */
        .it {
            text-align: justify
        }

        /* উদ্দীপকের ঘোষণা লাইন ইটালিক ও বোল্ড */
        .it {
            font-style: italic;
            font-weight: 700
        }

        /* বিবৃতির লেখা জাস্টিফাই */
        .st {
            text-align: justify
        }

        /* অপশন দুই কলামে (ছোট অপশন) */
        .op.g2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 2mm
        }

        /* অপশন দুই কলামে (মাপ অনুযায়ী) */
        .op.l2 {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            column-gap: 2mm
        }

        /* অপশন চার কলামে (মাপ অনুযায়ী) */
        .op.l4 {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            column-gap: 2mm
        }

        /* i, ii, iii বিবৃতি এক লাইনে */
        .sts.r1 {
            display: flex;
            gap: 2mm
        }

        /* এক লাইনের বিবৃতিতে লাইন না ভাঙা */
        .sts.r1 .st {
            padding: 0;
            white-space: nowrap
        }

        /* কোডের লেখা (মনোস্পেস ও বর্ডার) */
        .cd {
            font: .85em/1.25 monospace;
            white-space: pre-wrap;
            margin: 1mm 0;
            border: .2mm solid #999;
            padding: 1mm
        }

        /* প্রিভিউতে প্রশ্নের নিচে ফাঁকা নেই */
        .pv .qn {
            padding: 0
        }

        /* প্রশ্নের লেখা জাস্টিফাই */
        .jt {
            text-align: justify
        }

        /* বোর্ড ট্যাগের ছোট লেখা */
        .bt {
            font-size: .8em;
            white-space: nowrap
        }

        /* এডিটরের দুই কলাম (ফর্ম ও প্রিভিউ) */
        .ed2 {
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
            gap: 14px;
            align-items: start
        }

        /* ডুপ্লিকেট-চেক প্যানেল স্টিকি */
        .ed2>#sim {
            position: sticky;
            top: 64px;
            max-height: 80vh;
            overflow: auto;
            margin: 8px 0
        }

        /* ছোট স্ক্রিনে এডিটর এক কলাম */
        @media(max-width:800px) {
            .ed2 {
                grid-template-columns: 1fr
            }

            .ed2>#sim {
                position: static
            }
        }

        /* টানার যোগ্য প্রশ্নে grab কার্সার */
        .di {
            cursor: grab
        }

        /* টানার সময় লক্ষ্যে ড্যাশ বর্ডার */
        .di.ov {
            outline: 2px dashed #1f6feb;
            outline-offset: 1px
        }

        /* অপশনের বৃত্ত (ক, খ, গ, ঘ) */
        .ol {
            display: inline-block;
            width: 1.5em;
            height: 1.5em;
            line-height: 1.5em;
            border: .25mm solid currentColor;
            border-radius: 50%;
            text-align: center;
            font-size: .85em;
            margin-right: .5mm;
            vertical-align: middle
        }

        /* সঠিক উত্তরের ভরাট বৃত্ত (প্রিন্টেও রঙ থাকে) */
        .ol.on {
            background: var(--fg);
            color: var(--bg);
            font-weight: 700;
            print-color-adjust: exact;
            -webkit-print-color-adjust: exact
        }

        /* পাতা ও মাপার এলাকায় ভরাট বৃত্ত কালো */
        .pg .ol.on,
        .mz .ol.on {
            background: #000;
            color: #fff
        }

        /* পাতার ভেতরে বিন্যাসের জন্য position */
        .pg {
            position: relative
        }

        /* MathML গণিতের লেখার মাপ */
        math {
            font-size: 1.05em
        }

        /* ওভারলাইন (ওপরে দাগ) */
        .ov {
            display: inline-block;
            border-top: .08em solid currentColor;
            padding-top: .06em;
            line-height: 1.15;
            margin: 0 .03em
        }

        /* নেস্টেড ওভারলাইনে বাড়তি জায়গা */
        .ov:has(.ov) {
            padding-top: .22em
        }

        /* প্রথম পাতার হেডারের ঢাকনা */
        .h1w {
            position: relative
        }

        /* সেট কোডের বক্স (হেডারের বামে) */
        .sc {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            font-size: .85em;
            border: .25mm solid #000;
            padding: 0 1.5mm
        }

        /* ছবি ড্রপ করার এলাকা */
        .dz {
            border: 2px dashed var(--bd);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            color: var(--mu);
            font-size: 13px;
            margin-top: 4px
        }

        /* ফোকাস বা ড্র্যাগের সময় এলাকার রঙ */
        .dz:focus,
        .dz.ov {
            border-color: var(--ac);
            outline: 0
        }

        /* প্রিন্টের পাতা A4, মার্জিন নেই */
        @page {
            size: A4;
            margin: 0
        }

        /* শেষ পাতার পর পেজ ব্রেক নেই */
        #print .pg:last-child {
            break-after: auto
        }

        /* প্রিন্টের সময়ের স্টাইল */
        @media print {
            /* প্রিন্টে লুকানো অংশ (নেভিগেশন, বাটন) */
            .no-print {
                display: none !important
            }

            /* প্রিন্টে সাদা ব্যাকগ্রাউন্ড */
            body {
                background: #fff
            }

            /* প্রিন্টে প্যাডিং ও সীমা নেই */
            .wrap {
                padding: 0;
                max-width: none
            }

            /* প্রিন্টে স্ক্রল নেই */
            #print {
                overflow: visible
            }

            /* প্রিন্টে প্রতিটি পাতা আলাদা পেজ */
            .pg {
                box-shadow: none;
                margin: 0;
                break-after: page
            }
        }
    </style>
</head>

<!-- বডি অংশ -->
<body>
    <!-- অ্যাপের সব পাতা (ড্যাশবোর্ড, প্রশ্নব্যাংক ইত্যাদি) JavaScript দিয়ে এখানে আঁকা হয় -->
    <div id="app"></div>
    <!-- লেআউট মাপার লুকানো এলাকা (পেজে দেখা যায় না) -->
    <div id="meas"></div>
    <!-- Supabase ডেটাবেস লাইব্রেরি -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <!-- অ্যাপের মূল JavaScript (নিচে) -->
    <script>
        // =====================================================================
        // Zenith ICT Care – প্রশ্নব্যাংক: মূল JavaScript
        // কাজের ক্রম: ইউটিলিটি → রেন্ডারিং → লেআউট → ভিউ → অ্যাকশন → সেট →
        //             প্রিভিউ/ড্র্যাগ → ব্যাকআপ → বোর্ড/সাল → Supabase → লগইন
        // =====================================================================


        // ---------- ইউটিলিটি ও গ্লোবাল ভ্যারিয়েবল ----------
        // document.querySelector-এর সংক্ষিপ্ত রূপ
        const $ = (s) => document.querySelector(s);

        // বাংলা অঙ্কের তালিকা (ইংরেজি সংখ্যা বদলানোর জন্য)
        const BD = "০১২৩৪৫৬৭৮৯";

        // যেকোনো সংখ্যাকে বাংলা অঙ্কে বদলায় (যেমন 25 → ২৫)
        const bn = (n) => String(n).replace(/\d/g, (d) => BD[d]);

        // অপশনের লেবেল: ক, খ, গ, ঘ
        const LB = ["ক", "খ", "গ", "ঘ"];

        // বহুপদী প্রশ্নের ডিফল্ট চারটি অপশন
        const MD = ["i ও ii", "i ও iii", "ii ও iii", "i, ii ও iii"];

        // উদ্দীপকভিত্তিক প্রশ্নের ঘোষণা লাইনের ডিফল্ট তালিকা
        const PRE = ["নিচের উদ্দীপকটি পড়ো এবং", "নিচের চিত্রটি লক্ষ করো এবং", "নিচের সারণিটি দেখো এবং", "উদ্দীপকের আলোকে"];

        // প্রশ্নের ধরনের প্রদর্শন নাম
        const TY = { single: "Single", multi: "Multiple", group: "উদ্দীপক" };

        // HTML-এ বিশেষ চিহ্ন (&, <, >) নিরাপদ করার ফাংশন
        const esc = (s) => String(s == null ? "" : s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

        // ---------- অ্যাপের মূল ডেটা ও বর্তমান অবস্থা (state) ----------
        // S = ডেটাবেস থেকে আনা সব ডেটা (অধ্যায়, প্রশ্ন, সেট, বোর্ড, সাল)
        let S = { ch: [], q: [], sets: [], boards: [], years: [] };

        // SRC = প্রশ্নের উৎস (বোর্ড ও সাল) এর মানচিত্র
        let SRC = {};

        // view = এখন কোন পাতা (ভিউ) দেখানো হচ্ছে
        let view = "dash";

        // F = প্রশ্নব্যাংকের ফিল্টারের অবস্থা
        let F = { s: "", ch: "", t: "", b: "", y: "" };

        // ed = এখন যে প্রশ্নটি এডিট হচ্ছে
        let ed = null;

        // cur = এখন যে সেটটি খোলা আছে
        let cur = null;

        // last = সর্বশেষ পেজ লেআউটের ফলাফল
        let last = null;

        // ver = প্রিভিউর ধরন (q = শুধু প্রশ্ন, a = উত্তরসহ, b = দুটোই)
        let ver = "q";

        // lf = সর্বশেষ যে ইনপুট বা টেক্সটএরিয়াতে ফোকাস ছিল
        let lf = null;

        // localStorage থেকে ব্যবহারকারীর সেটিং পড়ে (ব্যর্থ হলে ফাঁকা)
        try {
          S.opt = JSON.parse(localStorage.getItem("zic_opt")) || {};
        } catch (e) {
          S.opt = {};
        }

        // সেটিং localStorage-এ সংরক্ষণ করে
        const save = () => {
          try {
            localStorage.setItem("zic_opt", JSON.stringify(S.opt || {}));
          } catch (e) {
          }
        };

        // নতুন র‍্যান্ডম UUID তৈরি করে
        const uid = () => "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
          const r = Math.random() * 16 | 0;
          return (c == "x" ? r : r & 3 | 8).toString(16);
        });

        // প্রশ্নটি কয়টি প্রশ্ন গণ্য হবে (উদ্দীপকে উপপ্রশ্ন সংখ্যা, নাহলে ১)
        const units = (q) => q.type == "group" ? q.kids.length : 1;

        // অধ্যায়ের আইডি থেকে "অধ্যায় ১: নাম" লেখা বানায়
        const chn = (id) => {
          const c = S.ch.find((x) => x.id == id);
          return c ? "অধ্যায় " + bn(c.n) + ": " + c.name : "—";
        };

        // একটি নতুন ফাঁকা উপপ্রশ্ন (single বা multi) তৈরি করে
        const ns = (t) => ({ type: t || "single", text: "", img: "", st: ["", "", ""], opts: t == "multi" ? [...MD] : ["", "", "", ""], ans: -1 });

        // একটি নতুন ফাঁকা প্রশ্নের অবজেক্ট তৈরি করে
        const newQ = () => ({ id: uid(), ch: F.ch || "", src: [], note: "", stem: { pre: PRE[0], text: "", code: "", img: "" }, kids: [ns()], ...ns() });

        // "a.b.c" পথ ধরে অবজেক্টের ভেতরে মান বসায়
        const setp = (o, k, v) => {
          const a = k.split(".");
          a.slice(0, -1).forEach((x) => o = o[x]);
          o[a.pop()] = v;
        };

        // ---------- প্রশ্ন রেন্ডারিং ----------
        // PT = প্রিন্টে বোর্ড ট্যাগ, EX = সব Expand, LM = লেআউট মোড
        let PT = false;
        let EX = false;
        let LM = false;

        // প্রিন্টে বোর্ড ট্যাগের HTML (যেমন [ঢা: বো: ’২৫])
        const T = (q) => PT && tag(q) ? " <span class=bt>[" + esc(tag(q)) + "]</span>" : "";

        // সেটিং চালু আছে কিনা (ডিফল্ট চালু)
        const OP = (k) => !S.opt || S.opt[k] !== false;

        // তালিকায় প্রশ্নের পাশে বোর্ড ও সালের ট্যাগ
        const bt2 = (q) => OP("l") && tag(q) ? " • " + esc(tag(q)) : "";

        // ছবির <img> ট্যাগ তৈরি করে
        const imgH = (i) => i ? `<img src="${i}" style="max-width:100%;display:block;margin:1mm auto">` : "";

        // MX = গণিত মোড (MathML) চালু আছে কিনা
        let MX = false;

        // LaTeX কমান্ড → ইউনিকোড চিহ্নের তালিকা
        const MS = { le: "≤", leq: "≤", ge: "≥", geq: "≥", ne: "≠", neq: "≠", times: "×", div: "÷", oplus: "⊕", cdot: "·", to: "→", rightarrow: "→", Rightarrow: "⇒", pm: "±", cdots: "…", ldots: "…", dots: "…" };

        // ঊর্ধ্বলিখন (সুপারস্ক্রিপ্ট) অক্ষরের তালিকা
        const SUP = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹", "+": "⁺", "-": "⁻", n: "ⁿ" };

        // নিম্নলিখন (সাবস্ক্রিপ্ট) অক্ষরের তালিকা
        const SUB = { 0: "₀", 1: "₁", 2: "₂", 3: "₃", 4: "₄", 5: "₅", 6: "₆", 7: "₇", 8: "₈", 9: "₉" };

        // সব অক্ষর ম্যাপে থাকলে ইউনিকোড অক্ষরে বদলায়, নাহলে ^ বা _ সহ মূল লেখা ফেরত দেয়
        const mp = (x, M, p) => x && [...x].every((c) => M[c]) ? [...x].map((c) => M[c]).join("") : p + x;

        // ওভারলাইনের সম্মিলিত চিহ্ন (ইউনিকোড ৭৭৩)
        const OV = String.fromCharCode(773);

        // LaTeX লেখাকে সাধারণ ইউনিকোড লেখায় বদলায়
        function ltx2txt(s) {
          // $ চিহ্ন সরিয়ে ফেলে
          s = String(s).replace(/\$\$?/g, "");
          // \overline, \text, \frac, \sqrt ইত্যাদি তিন ধাপে সরল করে
          for (let k = 0; k < 3; k++) s = s.replace(/\\(?:overline|bar)\{([^{}]*)\}/g, (_, a) => a.length > 1 ? "~{" + a + "}" : "~" + a).replace(/\\(?:text|mathrm|mathbf|textbf|mbox|operatorname)\{([^{}]*)\}/g, "$1").replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, (_, a, b) => (a.length > 1 ? "(" + a + ")" : a) + "/" + (b.length > 1 ? "(" + b + ")" : b)).replace(/\\sqrt\{([^{}]*)\}/g, (_, a) => "√" + (a.length > 1 ? "(" + a + ")" : a));
          // ঊর্ধ্ব (^) ও নিম্ন (_) লিখনকে ইউনিকোড অক্ষরে বদলায়
          s = s.replace(/\^\{([^{}]*)\}/g, (_, a) => mp(a, SUP, "^")).replace(/\^(\w)/g, (_, a) => mp(a, SUP, "^")).replace(/_\{([^{}]*)\}/g, (_, a) => mp(a, SUB, "_")).replace(/_(\w)/g, (_, a) => mp(a, SUB, "_"));
          // \le, \times ইত্যাদি চিহ্ন বদলায় ও বাড়তি কমান্ড পরিষ্কার করে
          s = s.replace(/\\(le|leq|ge|geq|ne|neq|times|div|oplus|cdot|to|rightarrow|Rightarrow|pm|cdots|ldots|dots)\b/g, (_, a) => MS[a]).replace(/\\(?:left|right|quad|qquad)\b/g, " ").replace(/\\[,;! ]/g, " ").replace(/\\([{}%&_#$])/g, "$1").replace(/\\([a-zA-Z]+)/g, "$1");
          // একাধিক স্পেসকে এক স্পেসে কমায়
          return s.replace(/ {2,}/g, " ");
        }

        // LaTeX লেখাকে MathML-এ রূপান্তর করে (গণিত মোডের জন্য)
        function m2(s) {
          // i = পড়ার বর্তমান অবস্থান
          let i = 0;
          // { } এর ভেতরের কাঁচা লেখা পড়ে (যেমন \text{...})
          const raw = () => {
            let r = "";
            if (s[i] == "{") {
              i++;
              while (i < s.length && s[i] != "}") r += s[i++];
              i++;
            }
            return r;
          };
          // একটি একক উপাদান (অক্ষর, সংখ্যা বা কমান্ড) MathML-এ বদলায়
          const atom = () => {
            const c = s[i++];
            // { } গ্রুপকে <mrow>-এ বদলায়
            if (c == "{") {
              const r = seq("}");
              i++;
              return "<mrow>" + r + "</mrow>";
            }
            // ব্যাকস্ল্যাশ কমান্ড (\frac, \sqrt, \overline ইত্যাদি) সামলায়
            if (c == "\\") {
              let n = "";
              while (/[a-zA-Z]/.test(s[i] || "")) n += s[i++];
              // ব্যাকস্ল্যাশের পর বিশেষ চিহ্ন বা স্পেস থাকলে
              if (!n) {
                const x = s[i++] || "";
                return /[ ,;!]/.test(x) ? '<mspace width="0.3em"></mspace>' : "<mo>" + esc(x) + "</mo>";
              }
              // \overline বা \bar → ওপরে দাগ
              if (n == "overline" || n == "bar") return "<mover>" + atom() + '<mo stretchy="true">¯</mo></mover>';
              // \frac → ভগ্নাংশ
              if (n == "frac") {
                const a = atom();
                const b = atom();
                return "<mfrac>" + a + b + "</mfrac>";
              }
              // \sqrt → বর্গমূল
              if (n == "sqrt") return "<msqrt>" + atom() + "</msqrt>";
              // \text ধরনের কমান্ড → সাধারণ লেখা
              if (/^(text|mathrm|mathbf|textbf|mbox|operatorname)$/.test(n)) return "<mtext>" + esc(raw()) + "</mtext>";
              // \left ও \right উপেক্ষা করে
              if (n == "left" || n == "right") return "";
              // পরিচিত চিহ্ন হলে সেটি, নাহলে নাম হিসেবে দেখায়
              return MS[n] ? "<mo>" + MS[n] + "</mo>" : "<mi>" + n + "</mi>";
            }
            // সংখ্যা পড়ে
            if (/\d/.test(c)) {
              let n = c;
              while (/[\d.]/.test(s[i] || "")) n += s[i++];
              return "<mn>" + n + "</mn>";
            }
            // ইংরেজি বা বাংলা অক্ষর
            if (/[A-Za-z\u0980-\u09FF]/.test(c)) return "<mi>" + c + "</mi>";
            // বাকি সব চিহ্ন
            return c == " " ? "" : "<mo>" + esc(c) + "</mo>";
          };
          // উপাদানের পর ^ (ঊর্ধ্ব) বা _ (নিম্ন) থাকলে msup/msub বানায়
          const post = () => {
            let b = atom();
            while (s[i] == "^" || s[i] == "_") {
              const u = s[i++] == "^";
              const g = u ? "sup" : "sub";
              b = "<m" + g + ">" + b + atom() + "</m" + g + ">";
            }
            return b;
          };
          // নির্দিষ্ট শেষ চিহ্ন পর্যন্ত ক্রমানুসারে উপাদান পড়ে
          const seq = (e) => {
            let r = "";
            while (i < s.length && s[i] != e) r += post();
            return r;
          };
          // পুরো লেখাকে <math> ট্যাগে মুড়ে ফেরত দেয়
          return "<math>" + seq("") + "</math>";
        }

        // ~A ও ~{AB} লেখাকে ওভারলাইন span-এ বদলায়
        const ovm = (h) => {
          for (let i = 0; i < 5; i++) {
            const p = h;
            h = h.replace(/~\{([^{}]*)\}/g, "<span class=ov>$1</span>").replace(/~\(([^()]*)\)/g, "<span class=ov>$1</span>");
            if (h == p) break;
          }
          return h.replace(/~([A-Za-z0-9\u0980-\u09FF])/g, "<span class=ov>$1</span>");
        };

        // লেখাকে দেখানোর উপযোগী HTML-এ বদলায় (গণিত মোডে $...$ অংশ MathML হয়)
        const rt = (s, mx) => mx ? String(s == null ? "" : s).split(/(\$\$?[^$]+\$\$?)/).map((p, i) => i % 2 ? m2(p.replace(/^\$+|\$+$/g, "")) : ovm(esc(p))).join("") : ovm(esc(s));

        // প্রতিটি প্রশ্নের অপশন-লেআউট মনে রাখার WeakMap
        const OL = new WeakMap();

        // একটি অপশনের HTML (সঠিক উত্তর হলে ভরাট বৃত্ত ও বোল্ড)
        const optH = (o, i, A) => {
          const c = A && o.ans == i;
          return `<span class="ol${c ? " on" : ""}">${LB[i]}</span> ${c ? "<b>" + rt(o.opts[i], MX) + "</b>" : rt(o.opts[i], MX)}`;
        };

        // একটি উপপ্রশ্নের HTML তৈরি করে
        function sub(o, n, A, t) {
          // মাপা লেআউট আছে কিনা এবং অপশন ছোট কিনা দেখে
          const L = LM && OL.get(o) || {};
          const sh = o.opts.every((x) => x.length <= 13);
          // প্রশ্নের লেখা, ছবি, (multi হলে i/ii/iii বিবৃতি) ও অপশন বসায়
          return `<div class=qn><div class=qno>${bn(n)}.</div><div class=qb><div class=jt>${rt(o.text, MX)}${t || ""}</div>${imgH(o.img)}` + (o.type == "multi" ? '<div class="sts' + (L.s ? " r1" : "") + '">' + o.st.map((s, i) => `<div class=st>${["i", "ii", "iii"][i]}. ${rt(s, MX)}</div>`).join("") + "</div><div class=jt>নিচের কোনটি সঠিক?</div>" : "") + `<div class="op ${L.o || (sh ? "g2" : "")}">` + o.opts.map((x, i) => "<div>" + optH(o, i, A) + "</div>").join("") + "</div></div></div>";
        }

        // পুরো প্রশ্ন ব্লকের HTML (সাধারণ প্রশ্ন বা উদ্দীপক গ্রুপ)
        function blk(q, n, A, r) {
          MX = !!q.mx;
          // সাধারণ প্রশ্ন হলে সরাসরি sub() ব্যবহার করে
          if (q.type != "group") return sub(q, n, A, T(q));
          // উদ্দীপকের তথ্য প্রস্তুত করে
          const k = q.kids.length;
          const m = q.stem;
          const R = r || { s: 1, a: 0, b: k };
          const ids = (k > 1 ? bn(n) + " ও " + bn(n + 1) : bn(n)) + " নং প্রশ্নের";
          // উদ্দীপকের ঘোষণা, লেখা, কোড ও ছবির পর উপপ্রশ্নগুলো বসায়
